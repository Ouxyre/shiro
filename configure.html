<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shiro SUB module setup</title>
<style>body{font:17px system-ui;background:#101724;color:#e7edf8;max-width:700px;margin:64px auto;padding:24px;line-height:1.6}input{box-sizing:border-box;width:100%;padding:14px;background:#1f2b40;border:1px solid #758399;color:white;border-radius:8px;font:inherit}button{padding:12px 20px;margin:18px 12px 0 0;background:#b4e2d5;border:0;border-radius:8px;font:inherit;cursor:pointer}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#b4e2d5}</style>
<h1>Shiro SUB module setup</h1><p>Upload <b>shiro-sub.js</b> and <b>shiro-sub.json</b> to a public file host. Paste the raw folder URL here to prepare the matching manifest URL.</p><label for="base">Raw folder URL</label><input id="base" type="url" placeholder="https://raw.githubusercontent.com/YOURNAME/sora-sources/main/"><p><button id="download">Download configured manifest</button></p><p id="status" role="status"></p><p>Import the raw JSON URL shown above in Sora or Shiroxi module settings. The helper works offline and sends no network requests.</p>
<script>
const manifest={"sourceName":"Shiro (SUB)","iconUrl":"https://shiro.so/favicon.ico","author":{"name":"Custom module","icon":"https://shiro.so/favicon.ico"},"version":"1.0.2","language":"Japanese (SUB)","description":"Shiro Japanese-audio Sub and Hard Sub servers. Dub excluded.","baseUrl":"https://shiro.so/","streamType":"HLS","quality":"1080p","searchBaseUrl":"https://shiro.so/browse?q=%s","scriptUrl":"https://YOUR-HOST/shiro-sub.js","type":"anime","downloadSupport":false,"asyncJS":true,"streamAsyncJS":true,"softsub":true};
document.getElementById('download').addEventListener('click',()=>{try{const u=new URL(document.getElementById('base').value.trim());if(u.protocol!=='https:'||u.search||u.hash||u.pathname.includes('/blob/')||/\.(js|json)$/.test(u.pathname))throw Error('Enter an HTTPS raw folder URL with no query string or filename.');const base=u.href.replace(/\/$/,'')+'/';const out={...manifest,scriptUrl:base+'shiro-sub.js'};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)+'\n'],{type:'application/json'}));a.download='shiro-sub.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.getElementById('status').textContent='After uploading the downloaded JSON, import:\n'+base+'shiro-sub.json';}catch(e){document.getElementById('status').textContent=e.message;}});
</script></html>
